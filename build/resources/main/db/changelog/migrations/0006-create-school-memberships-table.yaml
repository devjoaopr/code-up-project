databaseChangeLog:
  - changeSet:
      id: 0006-create-school-memberships-table
      author: devjoaopr
      changes:
        - createTable:
            tableName: school_memberships
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: school_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(30)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: school_memberships
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_memberships_user
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: school_memberships
            baseColumnNames: school_id
            referencedTableName: schools
            referencedColumnNames: id
            constraintName: fk_memberships_school
            onDelete: CASCADE

        - addUniqueConstraint:
            tableName: school_memberships
            columnNames: user_id, school_id
            constraintName: uk_membership_user_school

        - addUniqueConstraint:
            tableName: school_memberships
            columnNames: id, school_id
            constraintName: uk_membership_id_school

        - createIndex:
            tableName: school_memberships
            indexName: idx_memberships_school
            columns:
              - column:
                  name: school_id

        - createIndex:
            tableName: school_memberships
            indexName: idx_memberships_user
            columns:
              - column:
                  name: user_id

      rollback:
        - dropTable:
            tableName: school_memberships