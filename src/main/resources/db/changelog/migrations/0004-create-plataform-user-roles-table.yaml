databaseChangeLog:
  - changeSet:
      id: 0004-create-platform-user-roles-table
      author: devjoaopr
      changes:
        - createTable:
            tableName: platform_user_roles
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: platform_user_roles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_platform_roles_user
            onDelete: CASCADE

        - addUniqueConstraint:
            tableName: platform_user_roles
            columnNames: user_id, role
            constraintName: uk_platform_user_role

        - createIndex:
            tableName: platform_user_roles
            indexName: idx_platform_roles_user
            columns:
              - column:
                  name: user_id

      rollback:
        - dropTable:
            tableName: platform_user_roles